name: Build and Publish gpt-image-canvas

on:
  schedule:
    # 09:00 Asia/Shanghai == 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-gpt-image-canvas
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gpt-image-canvas
  SOURCE_REPOSITORY: mrslimslim/gpt-image-canvas
  SOURCE_REF: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out wrapper repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 1

      - name: Apply compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          git -C source apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/0001-web-add-randomuuid-fallback.patch"

      - name: Extract image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cd source

          version="$(python - <<'PY'
          from pathlib import Path
          import json

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          print(package.get("version", ""))
          PY
          )"
          short_sha="$(git rev-parse --short HEAD)"
          commit_sha="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          date_tag="$(date -u +%Y%m%d)"

          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "commit_sha=$commit_sha"
            echo "build_date=$build_date"
            echo "date_tag=$date_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags and labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.version != '' }}
            type=raw,value=${{ steps.meta.outputs.date_tag }}
            type=raw,value=sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=gpt-image-canvas
            org.opencontainers.image.description=Daily build of mrslimslim/gpt-image-canvas
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            NODE_IMAGE=node:24.15.0-bookworm-slim
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
            APT_MIRROR=http://deb.debian.org/debian
            APT_SECURITY_MIRROR=http://deb.debian.org/debian-security
          cache-from: type=gha
          cache-to: type=gha,mode=max
